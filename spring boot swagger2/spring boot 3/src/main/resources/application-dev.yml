server:
  port: 8081

app:
  name: Springboot 3 and Swagger2 Application (SIT environment)
  api:
    title: Spring Boot Basic APIs
    version: 1.0.0
    description: Mini application to show springboot 3 and SpringDoc 2
    externalDocDescription: Springboot 3 and SpringDoc 2 Github
    externalUrl: https://github.com/marksaballe/emy

spring-doc:
  swagger-ui:
    enabled: true